# Render Blueprint: deploys the backend as a Docker web service on the free plan.
# Free web services have no persistent disk, so the SQLite file under /data is ephemeral
# (history resets on redeploy/restart). The API contract and all tests are unaffected.
services:
  - type: web
    name: lyftr-chatbot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEYS          # paste "<groq key>,<gemini key>" in the Render dashboard
        sync: false
      - key: LLM_MODELS
        value: groq/openai/gpt-oss-20b,gemini/gemini-3.5-flash-lite
      - key: LLM_MODEL
        value: groq/openai/gpt-oss-20b
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS       # set to the Vercel URL once the frontend is deployed
        sync: false
